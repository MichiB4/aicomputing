[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aicomputing"
version = "0.2.0"
description = "AI Computing: LLM-based predictive execution as a programming paradigm."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["LLM", "runtime", "predictive execution", "ai computing", "oracle"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
ollama = ["ollama>=0.4.0"]
hf = ["transformers>=4.43,<5", "accelerate>=0.33.0", "sentencepiece>=0.1.99", "torch>=2.3"]
openai = ["openai>=2.30.0"]
# Optional system certificates for the evaluation command.
benchmarks = ["truststore>=0.8"]

[project.scripts]
aicomp = "aicomputing.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
