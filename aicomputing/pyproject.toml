[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicomputing"
version = "0.2.0"
description = "AI Computing: LLM-based predictive execution as a programming paradigm."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "ollama>=0.4.0",
  "pydantic>=2.7",
]
keywords = ["LLM", "runtime", "predictive execution", "ai computing", "oracle"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
hf = ["transformers>=4.43,<5", "accelerate>=0.33.0", "sentencepiece>=0.1.99", "torch>=2.3"]
openai = ["openai>=1.30"]
# evalplus supplies the HumanEval+ base/plus labelling and the MBPP+ inputs
# the ground-truth builder consumes. Without it the adapters degrade to
# pool="unknown" and MBPP+ plus invocations cannot be constructed, so it
# belongs in the benchmark extra rather than being discovered at runtime.
benchmarks = ["human-eval", "evalplus>=0.3", "datasets>=2.0", "tqdm",
              "truststore>=0.8", "openpyxl>=3.1"]
dev = ["pytest>=8", "pytest-cov"]
# The test suite imports the benchmark adapters, so a dev-only install
# cannot collect it. Kept explicit rather than implied.
test = ["pytest>=8", "pytest-cov", "evalplus>=0.3", "datasets>=2.0",
        "human-eval", "tqdm", "truststore>=0.8"]

[project.scripts]
aicomp = "aicomputing.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
