[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aicomputing-case-studies"
version = "0.3.0"
description = "TDMSci application study of specification-driven execution."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["aicomputing[openai]>=0.2.0", "streamlit>=1.50,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
research-entity-study = "paper_parser.study:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_parser = ["data/*.conll", "data/LICENSE", "data/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
