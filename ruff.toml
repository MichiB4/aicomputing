target-version = "py310"

[lint]
# Correctness checks only; formatting and modernization are not enforced.
select = ["E4", "E7", "E9", "F", "B"]
# zip() calls follow explicit length checks; Backend.close is an optional no-op hook.
ignore = ["B905", "B027"]

[lint.per-file-ignores]
# Tests use compact one-line assertions.
"tests/*" = ["E701", "E702"]
