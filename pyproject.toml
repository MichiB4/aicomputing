[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicomputing"
version = "0.2.0"
description = "AI Computing: LLM-based predictive execution as a programming paradigm."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "ollama>=0.4.0",
  "pydantic>=2.7",
]
keywords = ["LLM", "runtime", "predictive execution", "ai computing", "oracle"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
hf = ["transformers>=4.43,<5", "accelerate>=0.33.0", "sentencepiece>=0.1.99", "torch>=2.3"]
openai = ["openai>=1.30"]
benchmarks = ["human-eval", "datasets>=2.0", "tqdm"]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
aicomp = "aicomputing.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
